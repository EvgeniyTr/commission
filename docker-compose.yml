services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates ODOO_DB and installs partner_commission if not
  # already done, then exits. Runs once per `docker compose up` of the
  # whole stack - NOT on every `restart odoo`, since restarting a single
  # service doesn't re-run its dependencies. Keeping "-i" out of the
  # long-running odoo service's own command (below) is deliberate: passing
  # "-i" on every single boot/restart was observed to reset company
  # settings (e.g. currency) that were configured after install - not the
  # inert no-op it's normally assumed to be.
  odoo-init:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./partner_commission:/mnt/extra-addons/partner_commission
    command:
      [
        "-d", "${ODOO_DB:-commission_test}",
        "-i", "partner_commission",
        "--stop-after-init",
      ]

  odoo:
    image: odoo:18.0
    restart: unless-stopped
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      # Only this one addon is mounted - the build doesn't depend on the
      # rest of the monorepo, so copying just this folder + this file to
      # another machine is enough to run it.
      - ./partner_commission:/mnt/extra-addons/partner_commission
    command:
      # Deliberately no "-i" here - see odoo-init above. --db-filter hides
      # the database picker/manager screen, since there's only ever one
      # database in this setup.
      [
        "-d", "${ODOO_DB:-commission_test}",
        "--db-filter=^${ODOO_DB:-commission_test}$$",
      ]

volumes:
  odoo-db-data:
  odoo-web-data:
